<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Hub v0.1.2 Command Center</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #ffffff 0%, #fbcfe8 50%, #99f6e4 100%);
            background-attachment: fixed;
            color: #1e293b; 
            user-select: none; 
            height: 100vh; 
            overflow: hidden; 
            transition: background-position 0.2s ease-out;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.7); 
            box-shadow: 0 16px 40px 0 rgba(31, 38, 135, 0.08);
        }
        
        .channel-item { 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .channel-item.active { 
            background: rgba(236, 72, 153, 0.12); 
            border-left: 3px solid #ec4899; 
            color: #db2777; 
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .msg-animate {
            animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .chat-switch-animate {
            animation: fadeIn 0.25s ease-in-out forwards;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }
    </style>
</head>
<body class="flex flex-col antialiased" id="main-body">

<!-- Шапка -->
<header class="glass-panel border-b border-white/40 px-4 py-3 flex items-center justify-between shrink-0 z-30 shadow-sm">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="openGroupInfoModal()" title="Информация о группе и настройки">
        <div id="header-group-avatar" class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 via-rose-400 to-teal-400 p-0.5 flex items-center justify-center text-white font-bold shadow-md shadow-pink-500/20 overflow-hidden shrink-0">
            <i class="fa-solid fa-cube text-lg" id="header-group-icon"></i>
        </div>
        <div>
            <h1 class="font-bold text-xs sm:text-sm text-slate-800 flex items-center gap-2 flex-wrap">
                NEXUS HUB <span class="text-[9px] font-mono text-pink-600 bg-pink-500/10 px-1.5 py-0.5 rounded border border-pink-500/20">v0.1.2 PRO</span>
                <span id="admin-badge" class="hidden text-[8px] font-bold bg-amber-500/20 text-amber-700 border border-amber-500/30 px-2 py-0.5 rounded-full tracking-wider shadow-sm">ADMIN №1</span>
            </h1>
            <p class="text-[11px] text-slate-600 font-medium truncate max-w-[160px] sm:max-w-xs hover:text-pink-600 transition" id="current-target-title">Канал: Общий чат</p>
        </div>
    </div>
    
    <div class="flex items-center space-x-3">
        <div id="connection-status" class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-md shadow-red-500/50" title="Статус соединения"></div>
        <button id="btn-toggle-mic" class="px-3.5 py-1.5 rounded-xl bg-white/50 hover:bg-white/80 text-slate-700 font-semibold text-xs flex items-center space-x-2 transition cursor-pointer border border-white/80 shadow-sm">
            <i class="fa-solid fa-microphone-slash text-slate-400 text-xs" id="mic-icon"></i>
            <span id="mic-status-text">Микрофон выкл</span>
        </button>
        <button id="btn-toggle-listen" class="px-3.5 py-1.5 rounded-xl bg-teal-500/15 text-teal-700 border border-teal-500/30 font-semibold text-xs flex items-center space-x-2 transition cursor-pointer shadow-sm" title="Прослушка включена/выключена">

</header>

<!-- Основной макет интерфейса -->

    <!-- Окно чата -->

            <div id="chat-input-area" class="p-3 bg-white/50 border-t border-white/50 flex items-center space-x-2.5 shrink-0 backdrop-blur-2xl">

<div id="audio-peers-container" class="hidden"></div>

<script>
    let myUuid = localStorage.getItem('hub_user_uuid') || null;
    let amIAdmin = false;
    let wsClient = null, audioCtx = null, micStream = null, isMicActive = false, isListenActive = true;
    let activeTarget = { type: 'ROOM', targetId: 'general', name: 'Общий чат', description: '', avatar: '', channelType: 'text', allowedTags: [], adminUuid: null, members: [] };
    let myRooms = [];
    let usersListMap = {};
    let myBans = { text: false, images: false, links: false, mic: false, listen: false };
    const chatHistories = {};
    const peerConnections = {};
    const mutedPeers = new Set();
    let typingTimer = null;
    let activeTypingTimeout = null;

    const PROFANITY_BASE = ['хуй', 'пизд', 'ебат', 'ебал', 'ебу', 'трах', 'сука', 'блять', 'блядь', 'мразь', 'залуп', 'мудак', 'уеб', 'еблан', 'гондон', 'шлюх'];
    
    function normalizeText(text) {
        return text.toLowerCase()
            .replace(/[@0]/g, 'о')
            .replace(/[3]/g, 'з')
            .replace(/[1!i|l]/g, 'и')
            .replace(/[4æ]/g, 'а')
            .replace(/[5]/g, 'с')
            .replace(/[6b]/g, 'б')
            .replace(/[7]/g, 'т')
            .replace(/[8]/g, 'в')
            .replace(/xy/g, 'ху')
            .replace(/[\s\.\-_*\\/]+/g, '');
    }

    function censorText(text) {
        const words = text.split(/\s+/);
        return words.map(word => {
            const cleanWord = word.replace(/[^а-яё]/gi, '');
            if (cleanWord.length < 3) return word;
            const normalized = normalizeText(cleanWord);
            for (let prof of PROFANITY_BASE) {
                if (normalized.includes(prof)) {
                    return word.replace(/[а-яa-z0-9\*\.\-_]{3,}/gi, '███');
                }
            }
            return word;
        }).join(' ');
    }

    if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    function showBrowserNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
            new Notification(title, { body, icon: "https://cdn-icons-png.flaticon.com/512/3067/3067403.png" });
        }
    }

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host;
        wsClient = new WebSocket(`${protocol}//${host}`);

        wsClient.onopen = () => {
            document.getElementById('connection-status').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-md shadow-emerald-500/50";
            wsClient.send(JSON.stringify({ type: 'REGISTER', uuid: myUuid }));
            requestHistory(activeTarget.targetId);
            sendMarkRead(activeTarget.targetId);
        };

        wsClient.onmessage = async (e) => {
            try {
                const data = JSON.parse(e.data);

                if (data.type === 'INIT') {
                    myUuid = data.uuid;
                    localStorage.setItem('hub_user_uuid', myUuid);
                    amIAdmin = data.isAdmin;
                    myRooms = data.rooms;
                    renderRooms(data.rooms);
                    updateAdminStatus();
                }

                if (data.type === 'ADMIN_AUTH_SUCCESS') {
                    amIAdmin = true;
                    updateAdminStatus();
                }

                if (data.type === 'USER_LIST') {
                    usersListMap = {};
                    data.users.forEach(u => { usersListMap[u.uuid] = u; });
                    renderUsers(data.users);
                    if (activeTarget.type === 'ROOM') {
                        updateActiveRoomDetails();
                    }
                    
                    if (isMicActive && micStream && !myBans.mic) {
                        data.users.forEach(u => {
                            if (u.uuid !== myUuid && u.online && !peerConnections[u.uuid]) {
                                setupWebRTCConnection(u.uuid, true);
                            }
                        });
                    }
                }

                if (data.type === 'ROOM_LIST') {
                    myRooms = data.rooms;
                    renderRooms(data.rooms);
                    if (activeTarget.type === 'ROOM') {
                        updateActiveRoomDetails();
                    }
                }

                if (data.type === 'ROOM_CREATED_SUCCESS') {
                    closeModal();
                    selectRoom(data.roomId, document.getElementById('modal-room-name').value);
                }

                if (data.type === 'KICKED_FROM_ROOM') {
                    alert("Вы были исключены из комнаты администратором.");
                    selectRoom('general', 'Общий чат');
                }

                if (data.type === 'SERVER_BANS_UPDATED') {
                    myBans = data.bans;
                    applyBansUI();
                }

                if (data.type === 'ERROR') {
                    alert(data.message);
                }

                if (data.type === 'KICKED_FROM_PROGRAM') {
                    alert(data.message);
                    localStorage.removeItem('hub_user_uuid');
                    window.location.reload();
                }

                if (data.type === 'ADMIN_REVOKED') {
                    amIAdmin = false;
                    updateAdminStatus();
                    alert(data.message);
                }

                if (data.type === 'TYPING') {
                    if (activeTarget.type === 'DIRECT' && activeTarget.targetId === data.senderUuid) {
                        const senderObj = usersListMap[data.senderUuid];
                        const sName = senderObj ? senderObj.name : 'Собеседник';
                        const ind = document.getElementById('typing-indicator');
                        ind.innerText = `${sName} печатает...`;
                        ind.classList.remove('hidden');
                        
                        clearTimeout(activeTypingTimeout);
                        activeTypingTimeout = setTimeout(() => { 
                            ind.classList.add('hidden'); 
                        }, 1200);
                    }
                }

                if (data.type === 'MSG_READ_NOTIFY') {
                    const key = (data.targetId.startsWith('room_') || data.targetId === 'general') ? 'ROOM_' + data.targetId : 'DIRECT_' + data.targetId;
                    if (chatHistories[key]) {
                        chatHistories[key].forEach(m => {
                            if (m.senderUuid === myUuid) {
                                if (!m.readBy) m.readBy = {};
                                m.readBy[data.readerUuid] = data.readerName;
                            }
                        });
                        const currentKey = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;
                        if (key === currentKey) loadHistoryFromCache(key);
                    }
                }

                if (data.type === 'HISTORY_RESPONSE') {
                    const key = (data.targetId.startsWith('room_') || data.targetId === 'general') ? 'ROOM_' + data.targetId : 'DIRECT_' + data.targetId;
                    chatHistories[key] = data.history.map(item => ({
                        time: item.time,
                        senderUuid: item.senderUuid,
                        senderName: item.senderName,
                        content: item.isImage ? item.content : censorText(item.content),
                        isImage: item.isImage,
                        readBy: item.readBy || {}
                    }));
                    const currentKey = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;
                    if (key === currentKey) {
                        loadHistoryFromCache(key);
                        sendMarkRead(activeTarget.targetId);
                    }
                }

                if (data.type === 'ROOM_CHAT') {
                    const filteredContent = data.isImage ? data.content : censorText(data.content);
                    saveAndRenderMsg('ROOM_' + data.roomId, filteredContent, data.isImage, data.time, data.senderUuid, data.senderName, data.readBy || {});
                    if (data.senderUuid !== myUuid) {
                        showBrowserNotification(`Сообщение в комнате`, data.isImage ? '[Картинка]' : filteredContent);
                        sendMarkRead('room_' + data.roomId);
                    }
                }

                if (data.type === 'DIRECT_CHAT') {
                    const filteredContent = data.isImage ? data.content : censorText(data.content);
                    const chatKey = 'DIRECT_' + (data.senderUuid === myUuid ? activeTarget.targetId : data.senderUuid);
                    saveAndRenderMsg(chatKey, filteredContent, data.isImage, data.time, data.senderUuid, data.senderName, data.readBy || {});
                    if (data.senderUuid !== myUuid) {
                        showBrowserNotification(`Личное сообщение`, data.isImage ? '[Картинка]' : filteredContent);
                        if (activeTarget.type === 'DIRECT' && activeTarget.targetId === data.senderUuid) {
                            sendMarkRead(data.senderUuid);
                        }
                    }
                }

                if (data.type === 'MSG_DELETED') {
                    const key = (data.targetId.startsWith('room_') || data.targetId === 'general') ? 'ROOM_' + data.targetId : 'DIRECT_' + data.targetId;
                    if (chatHistories[key]) {
                        chatHistories[key] = chatHistories[key].filter(m => m.time !== data.timestamp);
                        const currentKey = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;
                        if (key === currentKey) loadHistoryFromCache(key);
                    }
                }

                if (['RTC_OFFER', 'RTC_ANSWER', 'RTC_ICE'].includes(data.type)) {
                    if (isListenActive) handleWebRTCSignaling(data);
                }
            } catch (err) {
                console.error("Parse error:", err);
            }
        };

        wsClient.onclose = () => {
            document.getElementById('connection-status').className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-md shadow-red-500/50";
            setTimeout(connectWebSocket, 3000);
        };

        wsClient.onerror = () => { wsClient.close(); };
    }

    window.addEventListener('DOMContentLoaded', () => {
        connectWebSocket();

        const chatMessagesContainer = document.getElementById('chat-messages');
        chatMessagesContainer.addEventListener('scroll', () => {
            const scrollTop = chatMessagesContainer.scrollTop;
            const maxScroll = chatMessagesContainer.scrollHeight - chatMessagesContainer.clientHeight;
            const scrollPercent = maxScroll > 0 ? (scrollTop / maxScroll) * 100 : 0;
            document.getElementById('main-body').style.backgroundPosition = `50% ${scrollPercent}%`;
        });

        const inputField = document.getElementById('chat-input');
        inputField.addEventListener('input', () => {
            if (activeTarget.type === 'DIRECT' && wsClient && wsClient.readyState === WebSocket.OPEN) {
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    wsClient.send(JSON.stringify({ type: 'TYPING', targetUuid: activeTarget.targetId }));
                }, 300);
            }
        });

        const sendMsg = () => {
            if (myBans.text) return alert("Отправка текста запрещена администратором.");
            const input = document.getElementById('chat-input');
            let text = input.value.trim();
            if (!text) return;

            if (myBans.links && (text.includes('http://') || text.includes('https://') || text.includes('www.'))) {
                return alert("Ссылки запрещены администратором.");
            }

            document.getElementById('typing-indicator').classList.add('hidden');
            text = censorText(text);

            const timestamp = new Date().toISOString();
            const key = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;

            const myNameObj = usersListMap[myUuid];
            const myName = myNameObj ? myNameObj.name : 'Я';

            saveAndRenderMsg(key, text, false, timestamp, myUuid, myName, {});

            if (activeTarget.type === 'ROOM') {
                wsClient.send(JSON.stringify({ type: 'ROOM_CHAT', roomId: activeTarget.targetId, content: text, isImage: false, time: timestamp }));
            } else {
                wsClient.send(JSON.stringify({ type: 'DIRECT_CHAT', targetUuid: activeTarget.targetId, content: text, isImage: false, time: timestamp }));
            }
            input.value = '';
        };

        document.getElementById('btn-send').addEventListener('click', sendMsg);
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });

        document.getElementById('image-input').addEventListener('change', (e) => {
            if (myBans.images) return alert("Картинки запрещены администратором.");
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const imgData = evt.target.result;
                const timestamp = new Date().toISOString();
                const key = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;
                
                const myNameObj = usersListMap[myUuid];
                const myName = myNameObj ? myNameObj.name : 'Я';

                saveAndRenderMsg(key, imgData, true, timestamp, myUuid, myName, {});

                if (activeTarget.type === 'ROOM') {
                    wsClient.send(JSON.stringify({ type: 'ROOM_CHAT', roomId: activeTarget.targetId, content: imgData, isImage: true, time: timestamp }));
                } else {
                    wsClient.send(JSON.stringify({ type: 'DIRECT_CHAT', targetUuid: activeTarget.targetId, content: imgData, isImage: true, time: timestamp }));
                }
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btn-toggle-mic').addEventListener('click', toggleMic);
        document.getElementById('btn-toggle-listen').addEventListener('click', toggleListen);
    });

            if (tagA !== tagB) {
                if (tagA === 'админ' || tagA === 'hostadmin') return -1;
                if (tagB === 'админ' || tagB === 'hostadmin') return 1;
                if (!tagA) return 1;

        document.querySelectorAll('[id^="dropdown_"]').forEach(el => el.classList.add('hidden'));
    });

    async function toggleMic() {
        if (myBans.mic) return alert("Микрофон заблокирован администратором.");
        
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        const btnToggleMic = document.getElementById('btn-toggle-mic');
        if (!isMicActive) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true,  
                        noiseSuppression: true,  
                        autoGainControl: true    
                    } 
                });

                isMicActive = true;
                document.getElementById('mic-status-text').innerText = "Вкл";
                document.getElementById('mic-icon').className = "fa-solid fa-microphone text-emerald-500 text-xs";
                btnToggleMic.className = "px-3.5 py-1.5 rounded-xl bg-emerald-500/15 text-emerald-700 border border-emerald-500/30 font-semibold text-xs flex items-center space-x-2 transition cursor-pointer shadow-sm";
                
                wsClient.send(JSON.stringify({ type: 'UPDATE_STATUS', micActive: true }));

                Object.keys(usersListMap).forEach(targetUuid => {
                    if (targetUuid !== myUuid && usersListMap[targetUuid].online) {
                        setupWebRTCConnection(targetUuid, true);
                    }
                });
            } catch (err) {
                console.error("Mic error:", err);
                alert("Ошибка доступа к микрофону. Проверьте разрешения браузера.");
            }
        } else {
            if (micStream) micStream.getTracks().forEach(track => track.stop());
            isMicActive = false;
            document.getElementById('mic-status-text').innerText = "Микрофон выкл";
            document.getElementById('mic-icon').className = "fa-solid fa-microphone-slash text-slate-400 text-xs";
            btnToggleMic.className = "px-3.5 py-1.5 rounded-xl bg-white/50 hover:bg-white/80 text-slate-700 font-semibold text-xs flex items-center space-x-2 transition cursor-pointer border border-white/80 shadow-sm";
            
            wsClient.send(JSON.stringify({ type: 'UPDATE_STATUS', micActive: false }));

            Object.keys(peerConnections).forEach(uuid => {
                peerConnections[uuid].close();
                delete peerConnections[uuid];
            });
        }
    }

    function toggleListen() {
        isListenActive = !isListenActive;
        const btn = document.getElementById('btn-toggle-listen');
        const icon = document.getElementById('listen-icon');
        const text = document.getElementById('listen-status-text');

        if (isListenActive) {
            icon.className = "fa-solid fa-volume-high text-xs";
            text.innerText = "Слышу всех";
            btn.className = "px-3.5 py-1.5 rounded-xl bg-teal-500/15 text-teal-700 border border-teal-500/30 font-semibold text-xs flex items-center space-x-2 transition cursor-pointer shadow-sm";
        } else {
            icon.className = "fa-solid fa-volume-xmark text-xs";
            text.innerText = "Никого не слышу";
            btn.className = "px-3.5 py-1.5 rounded-xl bg-red-500/15 text-red-700 border border-red-500/30 font-semibold text-xs flex items-center space-x-2 transition cursor-pointer shadow-sm";
            Object.keys(peerConnections).forEach(uuid => {
                const audioEl = document.getElementById(`audio_${uuid}`);
                if (audioEl) audioEl.srcObject = null;
            });
        }
        wsClient.send(JSON.stringify({ type: 'UPDATE_STATUS', listenActive: isListenActive }));
    }

    function setupWebRTCConnection(targetUuid, isInitiator) {
        if (peerConnections[targetUuid]) return peerConnections[targetUuid];
        
        const pc = new RTCPeerConnection({ 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' }
            ] 
        });
        peerConnections[targetUuid] = pc;

        if (micStream && isMicActive && !myBans.mic) {
            micStream.getTracks().forEach(track => pc.addTrack(track, micStream));
        }

        pc.onicecandidate = (e) => {
            if (e.candidate && wsClient && wsClient.readyState === WebSocket.OPEN) {
                wsClient.send(JSON.stringify({ type: 'RTC_ICE', targetUuid, candidate: e.candidate }));
            }
        };

        pc.ontrack = (e) => {
            if (!isListenActive) return;
            let audioEl = document.getElementById(`audio_${targetUuid}`);
            if (!audioEl) {
                audioEl = document.createElement('audio');
                audioEl.id = `audio_${targetUuid}`;
                audioEl.autoplay = true;
                audioEl.playsInline = true;
                document.getElementById('audio-peers-container').appendChild(audioEl);
            }
            audioEl.srcObject = e.streams[0];
            audioEl.muted = mutedPeers.has(targetUuid);
            audioEl.play().catch(err => console.log("Автозапуск аудио заблокирован браузером"));
        };

        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                pc.close();
                delete peerConnections[targetUuid];
                if (isMicActive && micStream && !myBans.mic) {
                    setTimeout(() => {
                        if (isMicActive && !peerConnections[targetUuid]) {
                            setupWebRTCConnection(targetUuid, true);
                        }
                    }, 2000);
                }
            }
        };

        if (isInitiator) {
            pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
                if (wsClient && wsClient.readyState === WebSocket.OPEN) {
                    wsClient.send(JSON.stringify({ type: 'RTC_OFFER', targetUuid, offer: pc.localDescription }));
                }
            }).catch(err => console.error("Offer creation error:", err));
        }
        return pc;
    }

    async function handleWebRTCSignaling(data) {
        if (!isListenActive) return;
        let pc = peerConnections[data.senderUuid] || setupWebRTCConnection(data.senderUuid, false);
        try {
            if (data.type === 'RTC_OFFER') {
                if (pc.signalingState !== "stable") {
                    await pc.setLocalDescription({ type: "rollback" }).catch(() => {});
                }
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                if (wsClient && wsClient.readyState === WebSocket.OPEN) {
                    wsClient.send(JSON.stringify({ type: 'RTC_ANSWER', targetUuid: data.senderUuid, answer: pc.localDescription }));
                }
            } else if (data.type === 'RTC_ANSWER') {
                if (pc.signalingState === "have-local-offer") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            } else if (data.type === 'RTC_ICE') {
                if (data.candidate && pc.remoteDescription) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        } catch (err) {
            console.error("WebRTC Signaling error:", err);
        }
    }

    function toggleLocalMute(targetUuid) {
        if (mutedPeers.has(targetUuid)) mutedPeers.delete(targetUuid);
        else mutedPeers.add(targetUuid);
        
        const audioEl = document.getElementById(`audio_${targetUuid}`);
        if (audioEl) audioEl.muted = mutedPeers.has(targetUuid);
        renderUsers(Object.values(usersListMap));
    }

    function toggleBan(targetUuid, banType) {
        wsClient.send(JSON.stringify({ type: 'TOGGLE_BAN', targetUuid, banType }));
    }

    function openModal() { 
        document.getElementById('modal-room-name').value = '';
        document.getElementById('modal-room-desc').value = '';
        document.getElementById('modal-room-avatar').value = '';
        document.getElementById('modal-allowed-tags').value = '';
        document.getElementById('modal-create-room').classList.remove('hidden'); 
    }
    
    function closeModal() { 
        document.getElementById('modal-create-room').classList.add('hidden'); 
    }

    function loadRoomAvatarFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('modal-room-avatar').value = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function submitCreateRoom() {
        const name = document.getElementById('modal-room-name').value.trim();
        const channelType = document.getElementById('modal-channel-type').value;
        const description = document.getElementById('modal-room-desc').value.trim();
        const avatar = document.getElementById('modal-room-avatar').value.trim();
        const tagsRaw = document.getElementById('modal-allowed-tags').value.trim();
        const allowedTags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
        const adminPass = document.getElementById('modal-admin-pass').value.trim();

        if (!name) return alert("Введите название группы!");
        if (!amIAdmin && adminPass !== '9898') return alert("Неверный админ-пароль!");

        wsClient.send(JSON.stringify({ 
            type: 'CREATE_ROOM', 
            name, 
            channelType,
            description, 
            avatar, 
            allowedTags,
            adminPassword: adminPass 
        }));
    }

    function makeUserAdmin(targetUuid) {
        if (confirm("Назначить участника администратором?")) wsClient.send(JSON.stringify({ type: 'MAKE_ADMIN', targetUuid }));
    }

    function addToRoom(roomId, userUuid) {
        wsClient.send(JSON.stringify({ type: 'ADD_TO_ROOM', roomId, targetUuid: userUuid }));
        alert("Участник добавлен в группу!");
    }

    function kickFromRoom(roomId) {
        if (confirm("Удалить группу?")) {
            wsClient.send(JSON.stringify({ type: 'KICK_FROM_ROOM', roomId, targetUuid: myUuid }));
            selectRoom('general', 'Общий чат');
        }
    }

    function selectRoom(id, name) {
        const found = myRooms.find(r => r.id === id);
        activeTarget = { 
            type: 'ROOM', 
            targetId: id, 
            name, 
            description: found ? found.description : '', 
            avatar: found ? found.avatar : '',
            channelType: found ? found.channelType : 'text',
            allowedTags: found ? found.allowedTags : [],
            adminUuid: found ? found.adminUuid : null,
            members: found ? found.members : []
        };
        
        document.getElementById('current-target-title').innerText = `${activeTarget.channelType === 'voice' ? 'Голосовой канал' : 'Канал'}: ${name}`;
        
        const headerAvatarBox = document.getElementById('header-group-avatar');
        if (found && found.avatar) {
            headerAvatarBox.innerHTML = `<img src="${found.avatar}" class="w-full h-full object-cover">`;
        } else {
            let iconClass = activeTarget.channelType === 'voice' ? 'fa-microphone' : 'fa-hashtag';
            headerAvatarBox.innerHTML = `<i class="fa-solid ${iconClass} text-lg"></i>`;
        }

        const inputArea = document.getElementById('chat-input-area');
        if (activeTarget.channelType === 'voice') {
            inputArea.style.display = 'none';
        } else {
            inputArea.style.display = 'flex';
        }

        const mainChat = document.querySelector('main > div');
        mainChat.classList.remove('chat-switch-animate');
        void mainChat.offsetWidth;
        mainChat.classList.add('chat-switch-animate');

        requestHistory(id);
        sendMarkRead(id);
        renderRooms(myRooms);
    }

    function selectUser(uuid, name) {
        activeTarget = { type: 'DIRECT', targetId: uuid, name };
        document.getElementById('current-target-title').innerText = `Личный звонок с ${name}`;
        
        const headerAvatarBox = document.getElementById('header-group-avatar');
        headerAvatarBox.innerHTML = `<i class="fa-solid fa-phone text-lg"></i>`;

        document.getElementById('chat-input-area').style.display = 'flex';

        const mainChat = document.querySelector('main > div');
        mainChat.classList.remove('chat-switch-animate');
        void mainChat.offsetWidth;
        mainChat.classList.add('chat-switch-animate');

        requestHistory(uuid);
        sendMarkRead(uuid);
        renderRooms(myRooms);
    }

    function saveAndRenderMsg(key, content, isImage, timestamp = null, senderUuid = null, senderName = null, readBy = {}) {
        if (!chatHistories[key]) chatHistories[key] = [];
        const timeVal = timestamp || new Date().toISOString();
        
        const existing = chatHistories[key].find(m => m.time === timeVal);
        if (existing) {
            existing.readBy = readBy;
        } else {
            chatHistories[key].push({ time: timeVal, content, isImage, senderUuid, senderName, readBy });
        }

        const currentKey = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;
        if (key === currentKey) loadHistoryFromCache(key);
    }

    function formatDateHeader(dateString) {
        const msgDate = new Date(dateString);
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        if (msgDate.toDateString() === today.toDateString()) return 'Сегодня';
        if (msgDate.toDateString() === yesterday.toDateString()) return 'Вчера';

        return msgDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatMsgTime(dateString) {
        const date = new Date(dateString);
        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function loadHistoryFromCache(key) {
        const chatEl = document.getElementById('chat-messages');
        chatEl.innerHTML = '<div class="text-center text-slate-500 text-[11px] py-2 bg-white/40 rounded-2xl mb-1 shadow-sm backdrop-blur-md">История синхронизирована с сервером</div>';
        
        const list = chatHistories[key] || [];
        let lastDateStr = null;

        list.forEach((m, index) => {
            const dateStr = formatDateHeader(m.time);
            if (dateStr !== lastDateStr) {
                lastDateStr = dateStr;
                const dateDiv = document.createElement('div');
                dateDiv.className = "flex justify-center my-3";
                dateDiv.innerHTML = `<span class="px-3 py-1 rounded-xl bg-white/50 backdrop-blur-md text-[10px] font-bold text-slate-500 border border-white/60 shadow-sm">${dateStr}</span>`;
                chatEl.appendChild(dateDiv);
            }

            const isMe = m.senderUuid === myUuid;
            const prevMsg = index > 0 ? list[index - 1] : null;
            const nextMsg = index < list.length - 1 ? list[index + 1] : null;

            const timeCurrent = new Date(m.time).getTime();
            
            const isSameSenderAsPrev = prevMsg && prevMsg.senderUuid === m.senderUuid && (timeCurrent - new Date(prevMsg.time).getTime() < 180000);
            const isSameSenderAsNext = nextMsg && nextMsg.senderUuid === m.senderUuid && (new Date(nextMsg.time).getTime() - timeCurrent < 180000);

            let radiusClass = 'rounded-2xl';
            if (isSameSenderAsPrev && isSameSenderAsNext) {
                radiusClass = isMe ? 'rounded-l-2xl rounded-r-md' : 'rounded-r-2xl rounded-l-md';
            } else if (isSameSenderAsPrev) {
                radiusClass = isMe ? 'rounded-tl-2xl rounded-bl-md rounded-r-2xl' : 'rounded-tr-2xl rounded-br-md rounded-l-2xl';
            } else if (isSameSenderAsNext) {
                radiusClass = isMe ? 'rounded-tr-2xl rounded-br-md rounded-l-2xl' : 'rounded-tl-2xl rounded-bl-md rounded-r-2xl';
            }

            renderSingleMsg(m.content, m.isImage, m.time, m.senderUuid, m.senderName, m.readBy || {}, false, isSameSenderAsPrev, radiusClass);
        });
    }

    function deleteMessage(timestamp, content) {
        if (confirm("Удалить это сообщение?")) {
            const targetId = activeTarget.type === 'ROOM' ? 'room_' + activeTarget.targetId : activeTarget.targetId;
            wsClient.send(JSON.stringify({ type: 'DELETE_MSG', targetId, timestamp, content }));

            const key = activeTarget.type === 'ROOM' ? 'ROOM_' + activeTarget.targetId : 'DIRECT_' + activeTarget.targetId;
            if (chatHistories[key]) {
                chatHistories[key] = chatHistories[key].filter(m => m.time !== timestamp);
                loadHistoryFromCache(key);
            }
        }
    }

    function removeUserAdmin(targetUuid) {
        if (confirm("Снять права администратора с этого пользователя?")) {
            wsClient.send(JSON.stringify({ type: 'REMOVE_ADMIN', targetUuid }));
        }
    }

    function kickUserFromProgram(targetUuid) {
        if (confirm("Вы уверены, что хотите полностью удалить этого участника из программы?")) {
            wsClient.send(JSON.stringify({ type: 'KICK_USER_FROM_PROGRAM', targetUuid }));
        }
    }

    function renderSingleMsg(content, isImage, timestamp = null, senderUuid = null, senderName = null, readBy = {}, animate = true, isGrouped = false, radiusClass = 'rounded-2xl') {
        const chatEl = document.getElementById('chat-messages');
        const isMe = senderUuid === myUuid;
        let body = isImage ? `<img src="${content}" class="max-w-[260px] sm:max-w-md rounded-2xl mt-1 border border-white/50 shadow-md">` : `<p class="text-slate-800 break-all [overflow-wrap:anywhere] font-medium">${content}</p>`;
        
        let statusIcon = '';
        if (isMe) {
            const readersArray = Object.values(readBy);
            const isRead = readersArray.length > 0;

            if (isRead) {
                const readerNamesStr = readersArray.join(', ');
                statusIcon = `<span class="text-[9px] text-pink-600 ml-1.5 font-bold cursor-help" title="Прочитали: ${readerNamesStr}">✓✓</span>`;
            } else {
                statusIcon = `<span class="text-[9px] text-slate-400 ml-1.5 font-bold" title="Доставлено">✓</span>`;
            }
        }

        let deleteBtn = '';
        if (isMe || amIAdmin) {
            const escapedContent = encodeURIComponent(content);
            deleteBtn = `<button onclick="deleteMessage('${timestamp}', decodeURIComponent('${escapedContent}'))" class="text-[10px] text-slate-400 hover:text-red-500 ml-2 transition" title="Удалить"><i class="fa-solid fa-trash"></i></button>`;
        }

        const timeString = timestamp ? formatMsgTime(timestamp) : '';

        let nameHeader = '';
        if (activeTarget.type === 'ROOM' && !isMe && !isGrouped) {
            const senderUserObj = usersListMap[senderUuid];
            const displayName = senderName || (senderUserObj ? senderUserObj.name : 'Участник');
            const displayTag = senderUserObj && senderUserObj.tag ? `<span class="text-[8px] bg-pink-500/10 text-pink-600 px-1 py-0.2 rounded font-mono ml-1">${senderUserObj.tag}</span>` : '';
            nameHeader = `<div class="text-[10px] font-bold text-pink-600 mb-1 flex items-center">${displayName}${displayTag}</div>`;
        }

        const div = document.createElement('div');
        div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} ${isGrouped ? 'mb-0.5' : 'mb-2'} ${animate ? 'msg-animate' : ''}`;
        
        const bubbleStyle = isMe 
            ? 'bg-gradient-to-tr from-pink-500/20 to-rose-500/15 border border-pink-500/30 text-slate-900 shadow-md shadow-pink-500/5' 
            : 'bg-white/60 border border-white/80 text-slate-900 shadow-md';

        div.innerHTML = `
            <div class="max-w-[90%] sm:max-w-2xl ${radiusClass} px-4 py-2 ${bubbleStyle} backdrop-blur-2xl relative group">
                ${nameHeader}
                <div class="flex items-end justify-between gap-3">
                    <div class="flex-1">${body}</div>
                    <div class="flex items-center text-[10px] text-slate-400 shrink-0 pb-0.5 gap-1">
                        <span>${timeString}</span>
                        ${statusIcon}
                        ${deleteBtn}
                    </div>
                </div>
            </div>
        `;
        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
    }
</script>
